- id: human-biology
  title: Human Biology
  status: planned
  order: 21
  description: How our bodies work, from cells and blood to the tiny helpers inside us.

- id: electricity-energy
  title: Electricity & Energy
  status: planned
  order: 22
  description: Sparks, magnets, batteries and the energy that powers our world.

- id: genetics-dna
  title: Genetics & DNA
  status: planned
  order: 23
  description: Why we look like our families, and the tiny instructions inside every cell.
